name: 🐍 Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # cada medianoche UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para push al branch 'output'

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Pipetboy2001
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=F85D7F&color_dots=#F8D866,#F7EE64,#F7D747,#DD6017,#DD39DB

      - name: 🚀 Deploy to 'output' branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
