name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *' # diario a medianoche
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: Pipetboy2001
          github_token: ${{ secrets.GITHUB_TOKEN }} # opcional, se puede omitir
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=F85D7F&color_dots=#F8D866,#F7EE64,#F7D747,#DD6017,#DD39DB

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
